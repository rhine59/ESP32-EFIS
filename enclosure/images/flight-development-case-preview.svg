<line x1="630" y1="175" x2="630" y2="191" class="dim"/>
<text x="555" y="190" class="s">4 mm flange</text>
<text x="715" y="270" class="s">79.6 mm locating body</text>
<text x="715" y="300" class="s">80.3 mm target panel opening</text>
<text x="715" y="330" class="s">3.0 mm nominal wall</text>
