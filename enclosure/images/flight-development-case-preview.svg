<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650">
<rect width="1100" height="650" fill="white"/>
<style>
.t{font:22px Arial,sans-serif;fill:#111}.s{font:16px Arial,sans-serif;fill:#222}.d{stroke:#111;stroke-width:2;fill:none}.dim{stroke:#555;stroke-width:1.5;fill:none;marker-start:url(#a);marker-end:url(#a)}.c{stroke:#aaa;stroke-width:1;stroke-dasharray:6 6}
