<line x1="100" y1="321" x2="492" y2="321" class="c"/>
<g fill="white" stroke="#111" stroke-width="2"><circle cx="170.2" cy="195.2" r="8.8"/><circle cx="421.8" cy="195.2" r="8.8"/><circle cx="170.2" cy="446.8" r="8.8"/><circle cx="421.8" cy="446.8" r="8.8"/></g>
<text x="145" y="535" class="s">88 mm flange</text>
<text x="225" y="315" class="s">53.6 mm</text>
<text x="223" y="336" class="s">display opening</text>
<text x="140" y="181" class="s">Ø4.4</text>
