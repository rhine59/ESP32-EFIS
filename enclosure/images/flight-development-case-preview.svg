<text x="40" y="40" class="t">ESP32 Artificial Horizon — Flight-development enclosure</text>
<text x="40" y="68" class="s">3⅛-in panel format • four-hole 62.9 mm square pattern • Ø4.4 mm mounting clearance • verify actual aircraft panel</text>
<text x="230" y="115" class="t">Front view</text>
<rect x="120" y="145" width="352" height="352" rx="20" class="d"/>
