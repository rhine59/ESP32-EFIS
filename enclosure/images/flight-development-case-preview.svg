<rect x="40" y="565" width="1020" height="55" rx="8" fill="#f4f4f4" stroke="#aaa"/>
<text x="55" y="590" class="s">Important: flight-development CAD only. Verify actual Skyranger panel cutout, screw centres, depth, control clearances, material, fasteners,</text>
<text x="55" y="612" class="s">thermal behaviour, vibration resistance and installation approval before use in flight. Not an approved primary flight instrument.</text>
