{% extends "base.html" %}{% block content %}<section class="card"><h1>Create account</h1>{% if error %}<p>{{error}}</p>{% endif %}<form method="post"><label>Email<input type="email" name="email" required></label><label>Password<input type="password" name="password" minlength="12" required></label><button>Create account</button></form></section>{% if dev_reset_enabled %}<section class="card"><h2>Development reset</h2><p>Reset an existing account to unverified and send a fresh verification email.</p><form method="post" action="/dev/reset-registration"><label>Email<input type="email" name="email" required></label><button>Reset and resend verification</button></form></section>{% endif %}{% endblock %}
