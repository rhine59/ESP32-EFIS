services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-efis_accounts}
      POSTGRES_USER: ${POSTGRES_USER:-efis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - efis-account-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U ${POSTGRES_USER:-efis} -d ${POSTGRES_DB:-efis_accounts}"]
      interval: 10s
      timeout: 5s
      retries: 5

  account:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-efis}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-efis_accounts}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
      LICENSE_SIGNER_URL: ${LICENSE_SIGNER_URL:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8091:8091"

volumes:
  efis-account-db:
