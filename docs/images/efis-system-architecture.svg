<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
<style>text{font-family:Arial,sans-serif;fill:#17212b}.title{font-size:34px;font-weight:700}.sub{font-size:18px}.h{font-size:21px;font-weight:700}.t{font-size:16px}.small{font-size:14px}.box{fill:#f7f9fb;stroke:#34495e;stroke-width:2}.core{fill:#e8f3ff;stroke:#1769aa;stroke-width:3}.sensor{fill:#eef9ee;stroke:#338a3e;stroke-width:2}.display{fill:#fff3e6;stroke:#c76b00;stroke-width:2}.power{fill:#fff0f0;stroke:#b23b3b;stroke-width:2}.ctrl{fill:#f5efff;stroke:#6d43a8;stroke-width:2}.line{fill:none;stroke:#34495e;stroke-width:3;marker-end:url(#a)}.dash{fill:none;stroke:#777;stroke-width:2;stroke-dasharray:8 7;marker-end:url(#a)}.note{fill:#fffbe6;stroke:#b69a2d;stroke-width:2}</style>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#34495e"/></marker></defs>
<rect width="1400" height="900" fill="white"/>
<text x="50" y="55" class="title">ESP32 EFIS — Bench Prototype System Architecture</text>
<text x="50" y="88" class="sub">Functional overview — authoritative wiring remains in docs/WIRING.md and docs/HARDWARE.md</text>
<rect x="530" y="280" width="340" height="230" rx="18" class="core"/>
<text x="700" y="325" text-anchor="middle" class="h">ESP32-S3-WROOM-1-N16R2</text><text x="700" y="355" text-anchor="middle" class="t">16 MB Quad flash • 2 MB Quad PSRAM</text><text x="700" y="390" text-anchor="middle" class="t">RGB565 display • SPI • I²C • PWM • USB</text><text x="700" y="430" text-anchor="middle" class="small">Chosen N16R2 variant retains GPIO35–37 availability</text><text x="700" y="460" text-anchor="middle" class="small">for the project shared SPI arrangement.</text>
<rect x="70" y="180" width="350" height="180" rx="15" class="display"/><text x="245" y="220" text-anchor="middle" class="h">Newhaven NHD-2.1-480480AF-ASXP</text><text x="245" y="255" text-anchor="middle" class="t">2.1-inch round • 480×480 • ST7701S</text><text x="245" y="287" text-anchor="middle" class="t">RGB565 parallel pixel data</text><text x="245" y="319" text-anchor="middle" class="t">9-bit serial startup/configuration</text>
<path d="M420 255 H530" class="line"/><text x="475" y="242" text-anchor="middle" class="small">RGB565</text>
<rect x="70" y="420" width="350" height="160" rx="15" class="ctrl"/><text x="245" y="458" text-anchor="middle" class="h">Controls</text><text x="245" y="492" text-anchor="middle" class="t">Bourns PEC09 rotary + push</text><text x="245" y="524" text-anchor="middle" class="t">MCP23008 I²C GPIO expander</text><text x="245" y="553" text-anchor="middle" class="small">LCD CSX/reset + encoder inputs</text>
<path d="M420 500 H530" class="line"/><text x="475" y="487" text-anchor="middle" class="small">I²C / GPIO</text>
<rect x="980" y="145" width="330" height="130" rx="15" class="sensor"/><text x="1145" y="184" text-anchor="middle" class="h">Bosch BMI088</text><text x="1145" y="218" text-anchor="middle" class="t">Attitude IMU • SPI</text><text x="1145" y="248" text-anchor="middle" class="small">Physical axis mapping still requires bench validation</text>
<path d="M980 210 H870" class="line"/><text x="925" y="197" text-anchor="middle" class="small">SPI</text>
<rect x="980" y="330" width="330" height="120" rx="15" class="sensor"/><text x="1145" y="370" text-anchor="middle" class="h">Adafruit BMP585 PID 6413</text><text x="1145" y="404" text-anchor="middle" class="t">Static pressure / altitude • I²C</text><text x="1145" y="432" text-anchor="middle" class="small">Ported development module</text>
<path d="M980 390 H870" class="line"/><text x="925" y="377" text-anchor="middle" class="small">I²C</text>
<rect x="980" y="500" width="330" height="120" rx="15" class="sensor"/><text x="1145" y="540" text-anchor="middle" class="h">PNI RM3100-CB 14754</text><text x="1145" y="574" text-anchor="middle" class="t">Remote magnetic heading sensor</text><text x="1145" y="602" text-anchor="middle" class="small">Remote mounting; final harness not frozen</text>
<path d="M980 560 H870" class="line"/><text x="925" y="547" text-anchor="middle" class="small">I²C</text>
<rect x="70" y="650" width="350" height="135" rx="15" class="power"/><text x="245" y="690" text-anchor="middle" class="h">Bench Power</text><text x="245" y="724" text-anchor="middle" class="t">Current-limited regulated supply</text><text x="245" y="754" text-anchor="middle" class="t">Korad KA3005P or Siglent SPD3303X-E</text>
<path d="M420 715 H610 V510" class="line"/><text x="500" y="700" class="small">5 V nominal bench input</text>
<rect x="530" y="650" width="340" height="135" rx="15" class="box"/><text x="700" y="690" text-anchor="middle" class="h">TPS61169 Backlight Driver</text><text x="700" y="724" text-anchor="middle" class="t">Constant-current boost • PWM brightness</text><text x="700" y="754" text-anchor="middle" class="small">Display backlight circuit validated separately</text>
<path d="M700 650 V510" class="line"/><text x="715" y="590" class="small">PWM</text>
<rect x="980" y="680" width="330" height="105" rx="15" class="box"/><text x="1145" y="720" text-anchor="middle" class="h">Native USB</text><text x="1145" y="754" text-anchor="middle" class="t">Development / programming • GPIO19/20</text><path d="M980 735 H870" class="line"/>
<rect x="70" y="820" width="1240" height="55" rx="12" class="note"/><text x="690" y="845" text-anchor="middle" class="h">SUPPLEMENTARY / NON-PRIMARY EFIS — BENCH DEVELOPMENT</text><text x="690" y="867" text-anchor="middle" class="small">Functional architecture only. Do not infer connector pin numbers or aircraft wiring from this illustration.</text>
</svg>