<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760"><style>text{font-family:Arial,sans-serif;fill:#17212b}.title{font-size:34px;font-weight:700}.h{font-size:20px;font-weight:700}.t{font-size:15px}.stage{stroke:#34495e;stroke-width:2}.arrow{stroke:#34495e;stroke-width:4;fill:none;marker-end:url(#a)}.gate{font-size:13px;font-weight:700}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#34495e"/></marker></defs><rect width="1500" height="760" fill="white"/><text x="50" y="60" class="title">ESP32 EFIS — Project Stages and Procurement Gates</text><text x="50" y="94" class="t">Use with BOM.md: buy parts when their stage is due; do not freeze later installation hardware before measurements and validation.</text>
<rect x="45" y="170" width="205" height="360" rx="16" fill="#e8f3ff" class="stage"/><text x="147" y="210" text-anchor="middle" class="h">STAGE 1</text><text x="147" y="240" text-anchor="middle" class="h">Bench Bring-up</text><text x="65" y="285" class="t">• ESP32-S3 N16R2</text><text x="65" y="315" class="t">• Newhaven display</text><text x="65" y="345" class="t">• FFC adapter/cable</text><text x="65" y="375" class="t">• TPS61169</text><text x="65" y="405" class="t">• PEC09 + MCP23008</text><text x="65" y="435" class="t">• Bench PSU + leads</text><text x="65" y="465" class="t">• Prototype wiring</text><text x="147" y="505" text-anchor="middle" class="gate">GATE: stable power,</text><text x="147" y="523" text-anchor="middle" class="gate">display + controls</text>
<path d="M250 350H285" class="arrow"/>
<rect x="285" y="170" width="205" height="360" rx="16" fill="#eef9ee" class="stage"/><text x="387" y="210" text-anchor="middle" class="h">STAGE 2</text><text x="387" y="240" text-anchor="middle" class="h">Sensor Integration</text><text x="305" y="290" class="t">• BMI088 attitude</text><text x="305" y="322" class="t">• BMP585 pressure</text><text x="305" y="354" class="t">• RM3100 heading</text><text x="305" y="386" class="t">• AHRS validation</text><text x="305" y="418" class="t">• Altimeter/compass</text><text x="305" y="450" class="t">• Power measurements</text><text x="305" y="482" class="t">• Failure/stale tests</text><text x="387" y="505" text-anchor="middle" class="gate">GATE: interfaces and</text><text x="387" y="523" text-anchor="middle" class="gate">instrument behavior stable</text>
<path d="M490 350H525" class="arrow"/>
<rect x="525" y="170" width="205" height="360" rx="16" fill="#fff8df" class="stage"/><text x="627" y="210" text-anchor="middle" class="h">STAGE 3</text><text x="627" y="240" text-anchor="middle" class="h">Aircraft Survey</text><text x="545" y="300" class="t">• Static tube OD/ID</text><text x="545" y="335" class="t">• Tee point/run length</text><text x="545" y="370" class="t">• Panel clearance</text><text x="545" y="405" class="t">• Magnetometer location</text><text x="545" y="440" class="t">• Cable routing</text><text x="545" y="475" class="t">• Magnetic environment</text><text x="627" y="505" text-anchor="middle" class="gate">DO NOT BUY guessed</text><text x="627" y="523" text-anchor="middle" class="gate">installation fittings</text>
<path d="M730 350H765" class="arrow"/>
<rect x="765" y="170" width="205" height="360" rx="16" fill="#f5efff" class="stage"/><text x="867" y="210" text-anchor="middle" class="h">STAGE 4</text><text x="867" y="240" text-anchor="middle" class="h">Physical Freeze</text><text x="785" y="300" class="t">• Optical window</text><text x="785" y="335" class="t">• Static fittings</text><text x="785" y="370" class="t">• RM3100 harness</text><text x="785" y="405" class="t">• Connector/gland</text><text x="785" y="440" class="t">• Enclosure details</text><text x="785" y="475" class="t">• Mounting provisions</text><text x="867" y="505" text-anchor="middle" class="gate">GATE: interfaces frozen</text><text x="867" y="523" text-anchor="middle" class="gate">for PCB/mechanics</text>
<path d="M970 350H1005" class="arrow"/>
<rect x="1005" y="170" width="205" height="360" rx="16" fill="#eaf6f7" class="stage"/><text x="1107" y="210" text-anchor="middle" class="h">STAGE 5</text><text x="1107" y="240" text-anchor="middle" class="h">Custom PCB</text><text x="1025" y="300" class="t">• KiCad review</text><text x="1025" y="335" class="t">• 4-layer layout</text><text x="1025" y="370" class="t">• Production BOM</text><text x="1025" y="405" class="t">• Prototype batch</text><text x="1025" y="440" class="t">• Bench electrical test</text><text x="1025" y="475" class="t">• Thermal/fault test</text><text x="1107" y="505" text-anchor="middle" class="gate">GATE: populated PCB</text><text x="1107" y="523" text-anchor="middle" class="gate">passes bench validation</text>
<path d="M1210 350H1245" class="arrow"/>
<rect x="1245" y="170" width="205" height="360" rx="16" fill="#fff0f0" class="stage"/><text x="1347" y="210" text-anchor="middle" class="h">STAGE 6</text><text x="1347" y="240" text-anchor="middle" class="h">Aircraft Installation</text><text x="1265" y="295" class="t">• 12 V input stage</text><text x="1265" y="330" class="t">• Transient/reverse</text><text x="1265" y="350" class="t">  protection + filtering</text><text x="1265" y="385" class="t">• Final wiring/connectors</text><text x="1265" y="420" class="t">• Circuit protection</text><text x="1265" y="455" class="t">• Panel mounting</text><text x="1265" y="490" class="t">• Installation validation</text>
<rect x="45" y="590" width="1405" height="105" rx="14" fill="#fffbe6" stroke="#b69a2d" stroke-width="2"/><text x="747" y="630" text-anchor="middle" class="h">Safety / configuration rule</text><text x="747" y="662" text-anchor="middle" class="t">Experimental supplementary/non-primary EFIS. Simulation must be unmistakable; missing, stale or implausible sensor data must invalidate the indication.</text><text x="747" y="685" text-anchor="middle" class="t">PCB fabrication remains parked until bench interfaces and installation constraints are validated.</text></svg>