services:
  efis-ota:
    image: nginx:1.27-alpine
    container_name: esp32-efis-ota
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/usr/share/nginx/html:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  efis-ota-admin:
    build:
      context: ./admin
    container_name: esp32-efis-ota-admin
    restart: unless-stopped
    environment:
      OTA_PUBLIC_ROOT: /data
      OTA_PUBLIC_BASE_URL: ${OTA_PUBLIC_BASE_URL:?set OTA_PUBLIC_BASE_URL in .env}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:?set ADMIN_SESSION_SECRET in .env}
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - ./public:/data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8090/healthz || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
