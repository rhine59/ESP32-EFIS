name: lollipop-ota
services:
  efis-ota:
    container_name: lollipop-efis-ota
    build: .
    restart: unless-stopped
    ports:
      # Public device downloads terminate TLS on the Synology reverse proxy.
      - "127.0.0.1:8180:8080"
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    volumes:
      - ./public:/usr/share/nginx/html:ro

  efis-ota-admin:
    container_name: lollipop-efis-ota-admin
    build: ./admin
    restart: unless-stopped
    # Administration is LAN/NAS-only by default. Do not put this endpoint on
    # the public EFIS update hostname. Access via DSM/VPN/private reverse proxy.
    ports:
      - "127.0.0.1:8090:8090"
    environment:
      OTA_PUBLIC_ROOT: /data
      OTA_ED25519_PRIVATE_KEY_PATH: /run/secrets/redone-release-signing.pem
      OTA_SIGNING_KEY_ID: ${OTA_SIGNING_KEY_ID:-redone-v2}
      OTA_PUBLIC_BASE_URL: ${OTA_PUBLIC_BASE_URL:-https://CHANGE-ME.example}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:?set ADMIN_SESSION_SECRET in .env}
    group_add:
      - "${OTA_DATA_GID:-65539}"
    volumes:
      - ./public:/data
      - ${OTA_SIGNING_KEY_FILE:?set OTA_SIGNING_KEY_FILE in .env}:/run/secrets/redone-release-signing.pem:ro
    security_opt:
      - no-new-privileges:true

networks:
  default:
    name: lollipop-ota-network
