services:
  efis-ota:
    build: .
    container_name: esp32-efis-ota
    restart: unless-stopped
    ports:
      # Origin is intentionally loopback-only. Public access terminates TLS on
      # the Synology reverse proxy; never forward Internet traffic to 8080.
      - "127.0.0.1:8080:8080"
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    volumes:
      - ./public:/usr/share/nginx/html:ro
