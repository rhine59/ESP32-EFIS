protocol:
  name: AEF-CAN
  long_name: Aircraft Experimental Flight CAN
  version:
    major: 1
    minor: 0
  status: adopted-v1
  role: supplementary-non-primary
  transport:
    baseline: classical-can
    bitrate: 500000
    identifier_bits: 11
    byte_order: little
    max_payload_bytes: 8
    can_fd_required: false

units:
  temperature:
    wire_unit: degC
    scale: 0.1
  pressure:
    wire_unit: bar
    scale: 0.01
  voltage:
    wire_unit: V
    scale: 0.01
  current:
    wire_unit: A
    scale: 0.01
  rotational_speed:
    wire_unit: rpm
    scale: 1
  altitude:
    wire_unit: m
    scale: 0.1
  speed:
    wire_unit: m/s
    scale: 0.01
  fuel_quantity:
    wire_unit: L
    scale: 0.01

id_ranges:
  - { start: 0x000, end: 0x07F, purpose: network_control }
  - { start: 0x080, end: 0x0FF, purpose: node_management }
  - { start: 0x100, end: 0x17F, purpose: engine }
  - { start: 0x180, end: 0x1FF, purpose: electrical }
  - { start: 0x200, end: 0x27F, purpose: air_data }
  - { start: 0x280, end: 0x2FF, purpose: navigation_gnss }
  - { start: 0x300, end: 0x37F, purpose: attitude_motion }
  - { start: 0x380, end: 0x3FF, purpose: fuel }
  - { start: 0x400, end: 0x47F, purpose: environmental }
  - { start: 0x480, end: 0x4FF, purpose: aircraft_state }
  - { start: 0x500, end: 0x57F, purpose: alerts_events }
  - { start: 0x580, end: 0x5BF, purpose: configuration_service }\n  - { start: 0x5C0, end: 0x5FF, purpose: firmware_maintenance }
  - { start: 0x600, end: 0x67F, purpose: diagnostics }
  - { start: 0x680, end: 0x6FF, purpose: logging_time }
  - { start: 0x700, end: 0x77F, purpose: experimental }
  - { start: 0x780, end: 0x7FF, purpose: reserved }

sensor_states:
  VALID: 0
  NOT_INSTALLED: 1
  OPEN_CIRCUIT: 2
  SHORT_CIRCUIT: 3
  OUT_OF_RANGE: 4
  STALE: 5
  CALIBRATING: 6
  SENSOR_FAULT: 7

sensor_ids:
  RPM: 1
  OIL_PRESSURE: 2
  OIL_TEMPERATURE: 3
  CHT_1: 16
  CHT_2: 17
  EGT_1: 32
  EGT_2: 33
  EGT_3: 34
  EGT_4: 35
  COOLANT_TEMPERATURE: 48
  SUPPLY_VOLTAGE: 64
  SUPPLY_CURRENT: 65
  INTERNAL_TEMPERATURE: 80

capabilities:
  RPM: 0
  CHT: 1
  EGT: 2
  OIL_TEMPERATURE: 3
  OIL_PRESSURE: 4
  COOLANT_TEMPERATURE: 5
  VOLTAGE: 6
  CURRENT: 7
  DIAGNOSTICS: 8

messages:
  - name: NODE_ANNOUNCE_V1
    id: 0x090
    version: 1
    rate_hz: 1
    transmit: boot_and_periodic
    timeout_ms: 3000
    fields:
      - { name: protocol_major, offset: 0, type: uint8 }
      - { name: protocol_minor, offset: 1, type: uint8 }
      - { name: node_type, offset: 2, type: uint8 }
      - { name: node_instance, offset: 3, type: uint8 }
      - { name: capabilities, offset: 4, type: uint32, note: bitmask }

  - name: NODE_HEARTBEAT_V1
    id: 0x091
    version: 1
    rate_hz: 1
    timeout_ms: 3000
    fields:
      - { name: node_type, offset: 0, type: uint8 }
      - { name: node_instance, offset: 1, type: uint8 }
      - { name: protocol_major, offset: 2, type: uint8 }
      - { name: protocol_minor, offset: 3, type: uint8 }
      - { name: uptime_s_mod, offset: 4, type: uint32, unit: s }

  - name: ENGINE_FAST_V1
    id: 0x100
    version: 1
    rate_hz: 10
    timeout_ms: 500
    fields:
      - { name: rpm, offset: 0, type: uint16, scale: 1, unit: rpm }
      - { name: oil_pressure, offset: 2, type: uint16, scale: 0.01, unit: bar }
      - { name: oil_temperature, offset: 4, type: int16, scale: 0.1, unit: degC }
      - { name: reserved, offset: 6, type: uint16, required_value: 0 }

  - name: CHT_V1
    id: 0x101
    version: 1
    rate_hz: 5
    timeout_ms: 1000
    fields:
      - { name: cht_1, offset: 0, type: int16, scale: 0.1, unit: degC }
      - { name: cht_2, offset: 2, type: int16, scale: 0.1, unit: degC }
      - { name: reserved, offset: 4, type: uint32, required_value: 0 }

  - name: EGT_12_V1
    id: 0x102
    version: 1
    rate_hz: 5
    timeout_ms: 1000
    fields:
      - { name: egt_1, offset: 0, type: int16, scale: 0.1, unit: degC }
      - { name: egt_2, offset: 2, type: int16, scale: 0.1, unit: degC }
      - { name: reserved, offset: 4, type: uint32, required_value: 0 }

  - name: EGT_34_V1
    id: 0x103
    version: 1
    rate_hz: 5
    timeout_ms: 1000
    fields:
      - { name: egt_3, offset: 0, type: int16, scale: 0.1, unit: degC }
      - { name: egt_4, offset: 2, type: int16, scale: 0.1, unit: degC }
      - { name: reserved, offset: 4, type: uint32, required_value: 0 }

  - name: ENGINE_COOLING_V1
    id: 0x104
    version: 1
    rate_hz: 5
    timeout_ms: 1000
    fields:
      - { name: coolant_temperature, offset: 0, type: int16, scale: 0.1, unit: degC }
      - { name: reserved, offset: 2, type: bytes, length: 6, required_value: 0 }

  - name: EIU_ELECTRICAL_V1
    id: 0x180
    version: 1
    rate_hz: 2
    timeout_ms: 2000
    fields:
      - { name: supply_voltage, offset: 0, type: uint16, scale: 0.01, unit: V }
      - { name: supply_current, offset: 2, type: int16, scale: 0.01, unit: A }
      - { name: reserved, offset: 4, type: uint32, required_value: 0 }

  - name: SENSOR_STATUS_V1
    id: 0x600
    version: 1
    rate_hz: 2
    timeout_ms: 2000
    note: "Generic paged sensor-status frame. One frame describes up to four logical sensors; additional pages use the same CAN ID."
    fields:
      - { name: node_instance, offset: 0, type: uint8 }
      - { name: page, offset: 1, type: uint8, note: "sensor indices page*4 through page*4+3" }
      - { name: sensor_0_id, offset: 2, type: uint8 }
      - { name: sensor_0_state, offset: 3, type: uint8, enum: sensor_states }
      - { name: sensor_1_id, offset: 4, type: uint8 }
      - { name: sensor_1_state, offset: 5, type: uint8, enum: sensor_states }
      - { name: sensor_2_id, offset: 6, type: uint8 }
      - { name: sensor_2_state, offset: 7, type: uint8, enum: sensor_states }
    continuation:
      note: "A fourth sensor is intentionally not packed into V1 because node/page provenance consumes two bytes. Pages repeat at the nominal status rate as required."

  - name: EIU_HEALTH_V1
    id: 0x601
    version: 1
    rate_hz: 1
    timeout_ms: 3000
    fields:
      - { name: internal_temperature, offset: 0, type: int16, scale: 0.1, unit: degC }
      - { name: reset_reason, offset: 2, type: uint8 }
      - { name: health_flags, offset: 3, type: uint8, note: bitmask }
      - { name: tx_error_count, offset: 4, type: uint16 }
      - { name: rx_error_count, offset: 6, type: uint16 }


  - name: FW_CONTROL_V1
    id: 0x5C0
    version: 1
    rate_hz: event
    fields:
      - { name: node_instance, offset: 0, type: uint8 }
      - { name: operation, offset: 1, type: uint8, note: "1=BEGIN, 2=FINISH, 3=ACTIVATE, 4=QUERY_TRANSFER" }
      - { name: transfer_id, offset: 2, type: uint16 }
      - { name: argument, offset: 4, type: uint32, note: "operation-specific; reserved zero unless defined" }

  - name: FW_META_V1
    id: 0x5C1
    version: 1
    rate_hz: event
    note: "Paged metadata. Complete product/hardware/version/size/digest/signature metadata is transferred before DATA; exact page catalogue remains additive."
    fields:
      - { name: node_instance, offset: 0, type: uint8 }
      - { name: page, offset: 1, type: uint8 }
      - { name: data, offset: 2, type: bytes, length: 6 }

  - name: FW_DATA_V1
    id: 0x5C2
    version: 1
    rate_hz: transfer
    note: "Adopted production transport: one-byte sequence plus seven firmware bytes. Sequence is local to the active 4 KiB transfer block; block CRC and final image verification provide higher-level integrity."
    fields:
      - { name: sequence, offset: 0, type: uint8, note: "frame sequence within current transfer block; wrap permitted with block byte count providing context" }
      - { name: data, offset: 1, type: bytes, length: 7 }

  - name: FW_STATUS_V1
    id: 0x5C3
    version: 1
    rate_hz: event
    fields:
      - { name: node_instance, offset: 0, type: uint8 }
      - { name: status, offset: 1, type: uint8, note: "1=READY, 2=ACK, 3=VERIFIED, 4=REJECTED, 5=REBOOT_PENDING, 6=CHECKPOINT, 7=RESUME, 8=NO_TRANSFER" }
      - { name: sequence, offset: 2, type: uint16, note: "last accepted or next expected sequence according to status" }
      - { name: detail, offset: 4, type: uint16, note: "machine-readable reason code; catalogue TBD" }
      - { name: reserved, offset: 6, type: uint16, required_value: 0 }


  - name: FW_CHECKPOINT_V1
    id: 0x5C4
    version: 1
    rate_hz: event
    note: "Durable resume checkpoint, nominally every 64 KiB. This is distinct from each 4 KiB CRC-verified transfer block. Offset is authoritative; percentage is presentation only."
    fields:
      - { name: transfer_id, offset: 0, type: uint16 }
      - { name: committed_offset, offset: 2, type: uint32, unit: bytes }
      - { name: checkpoint_integrity, offset: 6, type: uint16, note: "compact checkpoint-state integrity token; 4 KiB block CRC32 is carried by block-control/status exchange" }

compatibility:
  rules:
    - "Unknown message IDs are ignored."
    - "Existing field meanings are never silently redefined."
    - "Minor protocol revisions are additive/backward compatible."
    - "Incompatible semantics require a new major version or new message definition."
    - "Reserved transmitted bits/bytes are zero and ignored by receivers."
    - "Firmware version is independent of protocol version."
