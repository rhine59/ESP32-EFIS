<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Horizon EFIS Simulator</title><link rel="stylesheet" href="style.css"></head><body>
<main><section class="instrument"><div class="bezel"><div id="screen"></div></div><div class="controls"><button id="up">▲</button><button id="press">PRESS</button><button id="down">▼</button><button id="back">BACK</button></div></section>
