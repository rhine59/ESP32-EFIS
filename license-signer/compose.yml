services:
  signer:
    build: .
    container_name: esp32-efis-license-signer
    restart: unless-stopped
    environment:
      SIGNER_API_TOKEN: ${SIGNER_API_TOKEN:?set_SIGNER_API_TOKEN}
      SIGNER_KEY_ID: ${SIGNER_KEY_ID:-lic-2026-01}
      SIGNER_PRIVATE_KEY_FILE: /run/secrets/efis_license_ed25519.pem
    secrets: [efis_license_ed25519]
    ports: ["127.0.0.1:8092:8092"]
    read_only: true
    tmpfs: ["/tmp:size=16m,noexec,nosuid,nodev"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
secrets:
  efis_license_ed25519:
    file: ./secrets/efis_license_ed25519.pem
