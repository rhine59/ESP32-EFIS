name: ESP32EFISSimulator
options:
  bundleIdPrefix: uk.co.esp32efis
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.0
targets:
  ESP32EFISSimulator:
    type: application
    platform: iOS
    sources:
      - ESP32EFISSimulator
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uk.co.esp32efis.simulator
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "ESP32 EFIS"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets: []
