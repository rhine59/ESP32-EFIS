name: lollipop
services:
  efis-license-service:
    build: .
    ports:
      - "127.0.0.1:8094:8080"
    environment:
      DEVICE_ID: ${DEVICE_ID:-EFIS-SIM-0001}
      DEVICE_SECRET: ${DEVICE_SECRET:-simulator-development-secret-change-me}
    volumes:
      - license_keys:/data
    healthcheck:
      test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health',timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - default
      - efis-license

volumes:
  license_keys:
    name: esp32-efis_license_keys

networks:
  efis-license:
    name: efis-license
