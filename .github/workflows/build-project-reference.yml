name: Build indexed project PDF
on:
  push:
    paths:
      - 'tools/build_project_reference.py'
      - '.github/workflows/build-project-reference.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: pip install reportlab
      - run: python tools/build_project_reference.py
      - uses: actions/upload-artifact@v4
        with:
          name: MicroSky-Horizon-Project-Reference
          path: dist/MicroSky-Horizon-Project-Reference.pdf
