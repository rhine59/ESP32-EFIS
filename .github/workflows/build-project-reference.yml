name: Build complete indexed project manual
on:
  push:
    branches: [main]
    paths:
      - 'tools/build_manual.py'
      - '.github/workflows/build-project-reference.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: pip install reportlab
      - run: python tools/build_manual.py
      - name: Commit generated manual
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f docs/generated/MicroSky-Horizon-Complete-Project-Manual.pdf
          git diff --cached --quiet || git commit -m "Build current complete indexed project manual"
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: MicroSky-Horizon-Complete-Project-Manual
          path: docs/generated/MicroSky-Horizon-Complete-Project-Manual.pdf
