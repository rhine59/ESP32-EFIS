name: Build ESP-IDF hardware firmware (paused)

# Physical-hardware activity is paused while no prototype hardware is available.
# Keep this workflow for an explicit manual compile check only; pushes and pull
# requests must not start routine hardware-target builds during the pause.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build ESP32-S3 firmware (compile validation only)
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.4.4
          target: esp32s3
          path: firmware
