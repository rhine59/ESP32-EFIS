name: OTA architecture tests
on:
  push:
    paths:
      - 'ota-server/**'
      - 'efis-web-simulator/**'
      - 'customer-app/**'
      - 'protocol/**'
  pull_request:
    paths:
      - 'ota-server/**'
      - 'efis-web-simulator/**'
      - 'customer-app/**'
      - 'protocol/**'
jobs:
  ota-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Release dependency resolver
        working-directory: ota-server/admin
        run: python test_release_resolver.py
      - name: EIU OTA simulator
        working-directory: ota-server/admin
        run: python test_eiu_ota.py
      - name: EIU CAN OTA simulator
        working-directory: ota-server/admin
        run: python test_eiu_can_ota.py
      - name: End-to-end OTA simulator
        working-directory: ota-server/admin
        run: python test_end_to_end_ota.py
