name: Build enclosure STL files

on:
  push:
    paths:
      - 'enclosure/source/**'
      - '.github/workflows/build-enclosure.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-stl:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install OpenSCAD
        run: |
          sudo apt-get update
          sudo apt-get install -y openscad
      - name: Generate ESP32 EFIS enclosure STL files
        run: |
          mkdir -p enclosure/stl
          CASE=enclosure/source/ESP32_EFIS_Flight_Development_Case.scad
          CTRL=enclosure/source/ESP32_EFIS_Electronics_and_Controls.scad
          openscad -o enclosure/stl/ESP32_EFIS_Flight_Development_Body.stl -D 'part="BODY"' $CASE
          openscad -o enclosure/stl/ESP32_EFIS_Flight_Development_Display_Carrier.stl -D 'part="DISPLAY_CARRIER"' $CASE
          openscad -o enclosure/stl/ESP32_EFIS_Flight_Development_IMU_Carrier.stl -D 'part="IMU_CARRIER"' $CASE
          openscad -o enclosure/stl/ESP32_EFIS_Flight_Development_Front_Bezel.stl -D 'part="FRONT_BEZEL_CONTROL"' $CTRL
          openscad -o enclosure/stl/ESP32_EFIS_Custom_PCB_Fit_Gauge.stl -D 'part="PCB_FIT_GAUGE"' $CTRL
          openscad -o enclosure/stl/ESP32_EFIS_Flight_Development_Rear_Cover.stl -D 'part="REAR_COVER_SERVICE"' $CTRL
          openscad -o enclosure/stl/ESP32_EFIS_Flight_Development_USB_Strain_Relief_Clamp.stl -D 'part="USB_CLAMP"' $CTRL
          rm -f enclosure/stl/ESP32_Artificial_Horizon_*.stl
      - name: Commit regenerated STL files
        run: |
          if git diff --quiet -- enclosure/stl && [ -z "$(git ls-files --others --exclude-standard enclosure/stl)" ]; then
            echo "STL files are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A enclosure/stl
          git commit -m "Regenerate ESP32 EFIS enclosure STL files"
          git pull --rebase origin main
          git push origin HEAD:main
