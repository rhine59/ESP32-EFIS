name: Validate carrier PCB

on:
  push:
    paths:
      - 'hardware/kicad/tools/**'
      - '.github/workflows/validate-carrier-pcb.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate KiCad Revision A sources
        run: |
          : > hardware/kicad/tools/generate_carrier_rev_a.py
          for f in hardware/kicad/tools/generate_carrier_rev_a.py.part*; do
            cat "$f" >> hardware/kicad/tools/generate_carrier_rev_a.py
            printf '\n' >> hardware/kicad/tools/generate_carrier_rev_a.py
          done
          python3 hardware/kicad/tools/generate_carrier_rev_a.py

      - name: Install current KiCad stable
        run: |
          sudo add-apt-repository --yes ppa:kicad/kicad-10.0-releases
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends kicad zip
          kicad-cli --version

      - name: Generate schematic ERC report
        run: |
          mkdir -p hardware/kicad/carrier_rev_a/reports
          kicad-cli sch erc \
            --severity-all \
            --output hardware/kicad/carrier_rev_a/reports/erc.rpt \
            hardware/kicad/carrier_rev_a/carrier_rev_a.kicad_sch || true

      - name: Generate PCB DRC report
        run: |
          kicad-cli pcb drc \
            --severity-all \
            --all-track-errors \
            --output hardware/kicad/carrier_rev_a/reports/drc.rpt \
            hardware/kicad/carrier_rev_a/carrier_rev_a.kicad_pcb || true

      - name: Commit generated KiCad sources and reports
        run: |
          rm -f hardware/kicad/tools/generate_carrier_rev_a.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hardware/kicad
          if git diff --cached --quiet; then
            echo "Generated sources and reports are already current."
          else
            git commit -m "Generate carrier PCB Revision A validation reports"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Enforce clean schematic ERC
        run: |
          kicad-cli sch erc \
            --severity-all \
            --exit-code-violations \
            --output /tmp/erc-gate.rpt \
            hardware/kicad/carrier_rev_a/carrier_rev_a.kicad_sch

      - name: Enforce clean PCB DRC
        run: |
          kicad-cli pcb drc \
            --severity-all \
            --all-track-errors \
            --exit-code-violations \
            --output /tmp/drc-gate.rpt \
            hardware/kicad/carrier_rev_a/carrier_rev_a.kicad_pcb

      - name: Export fabrication package
        run: |
          rm -rf hardware/kicad/carrier_rev_a/manufacturing
          mkdir -p hardware/kicad/carrier_rev_a/manufacturing
          kicad-cli pcb export gerbers \
            --output hardware/kicad/carrier_rev_a/manufacturing/ \
            --layers F.Cu,In1.Cu,In2.Cu,B.Cu,F.Paste,B.Paste,F.Silkscreen,B.Silkscreen,F.Mask,B.Mask,Edge.Cuts \
            hardware/kicad/carrier_rev_a/carrier_rev_a.kicad_pcb
          kicad-cli pcb export drill \
            --output hardware/kicad/carrier_rev_a/manufacturing/ \
            --excellon-separate-th \
            --generate-map \
            --map-format gerberx2 \
            hardware/kicad/carrier_rev_a/carrier_rev_a.kicad_pcb
          (cd hardware/kicad/carrier_rev_a/manufacturing && zip -r ../carrier_rev_a_fabrication.zip .)

      - name: Commit validated manufacturing outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hardware/kicad/carrier_rev_a/manufacturing hardware/kicad/carrier_rev_a/carrier_rev_a_fabrication.zip
          if git diff --cached --quiet; then
            echo "Manufacturing outputs are already current."
            exit 0
          fi
          git commit -m "Export validated carrier PCB Revision A fabrication package"
          git pull --rebase origin main
          git push origin HEAD:main
