name: EFISService
options:
  bundleIdPrefix: uk.co.thingies
settings:
  base:
    SWIFT_VERSION: 6.0
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
targets:
  EFISService:
    type: application
    platform: iOS
    sources:
      - EFISService
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uk.co.thingies.EFISService
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: EFIS Service
        INFOPLIST_KEY_NSCameraUsageDescription: "Scan the EFIS Device ID QR code to request its signed entitlement."
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Connect to the EFIS and local EFIS services on your network."
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: YES
        INFOPLIST_KEY_CFBundleURLTypes_0_CFBundleURLSchemes_0: efisservice
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets: []
